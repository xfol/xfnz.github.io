<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Orbit · 搜索</title>
<style>
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  :root {
    --bg: #05060a;
    --line: rgba(255,255,255,.09);
    --line-2: rgba(255,255,255,.16);
    --text: #e8ecf4;
    --dim: rgba(203,213,235,.5);
    --cyan: #22d3ee;
    --violet: #a78bfa;
  }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 0 40px;
    color: var(--text);
    background: var(--bg);
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
      "PingFang SC", "Microsoft YaHei", monospace;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* 氛围层 */
  .ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(60% 50% at 50% 0%, rgba(34,211,238,.10), transparent 70%),
      radial-gradient(50% 45% at 82% 92%, rgba(167,139,250,.10), transparent 70%);
  }
  .grid { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,.032) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.032) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 10%, transparent 78%);
    mask-image: radial-gradient(circle at 50% 45%, #000 10%, transparent 78%);
  }
  .horizon { position: fixed; left: 50%; top: 0; width: 1px; height: 100vh; z-index: 0;
    transform: translateX(-50%);
    background: linear-gradient(180deg, transparent, rgba(34,211,238,.22), transparent);
    opacity: .8;
  }

  .shell {
    position: relative; z-index: 1;
    max-width: 860px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex; flex-direction: column;
    padding: 30px 0 26px;
  }

  /* 顶栏 */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--line);
    font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
  }
  .brand { display: flex; align-items: center; gap: 10px; color: #fff; }
  .mark {
    display: grid; place-items: center;
    width: 24px; height: 24px; border-radius: 6px;
    color: var(--cyan);
    background: linear-gradient(140deg, rgba(34,211,238,.18), rgba(167,139,250,.14));
    border: 1px solid rgba(34,211,238,.3);
    font-size: 12px;
    box-shadow: 0 0 20px -4px rgba(34,211,238,.5);
  }
  .brand small { color: var(--dim); font-size: 10px; letter-spacing: .24em; }
  .status { display: flex; align-items: center; gap: 10px; color: var(--dim); }
  .status b { color: rgba(232,236,244,.85); font-weight: 400; font-variant-numeric: tabular-nums; }
  /* 天气：加载失败时脚本会直接移除该节点 */
  .weather { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .weather[hidden] { display: none; }
  .weather .w-temp { color: rgba(232,236,244,.85); }
  .weather .w-city { color: rgba(203,213,235,.38); }
  #weather { cursor: pointer; }
  #weather:hover { color: #fff; }
  #weather .w-city { text-decoration: underline dotted rgba(203,213,235,.4); text-underline-offset: 3px; }

  /* 城市选择面板 */
  .city-modal {
    position: fixed; inset: 0; z-index: 20;
    display: grid; place-items: center;
    padding: 24px;
    background: rgba(3,5,9,.72);
    -webkit-backdrop-filter: blur(5px);
    backdrop-filter: blur(5px);
  }
  .city-modal[hidden] { display: none; }
  .city-box {
    width: min(460px, 100%);
    max-height: min(82vh, 640px);
    display: flex; flex-direction: column;
    padding: 20px;
    border-radius: 12px;
    background: #0b0f17;
    border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 30px 90px -30px rgba(0,0,0,.95), 0 0 70px -32px rgba(34,211,238,.5);
  }
  .city-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    color: rgba(232,236,244,.75);
  }
  .city-close {
    width: 26px; height: 26px;
    border: 1px solid rgba(255,255,255,.12); border-radius: 6px;
    background: transparent;
    color: rgba(203,213,235,.7);
    font: inherit; font-size: 14px; line-height: 1;
    cursor: pointer;
  }
  .city-close:hover { border-color: rgba(34,211,238,.5); color: #fff; }
  .city-auto {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-bottom: 12px; padding: 10px 12px;
    border: 1px solid rgba(255,255,255,.08); border-radius: 8px;
    background: rgba(255,255,255,.03);
    font-size: 11px; letter-spacing: .04em;
    color: rgba(203,213,235,.55);
  }
  .city-auto button {
    border: 0; background: transparent;
    color: #22d3ee; font: inherit; font-size: 11px;
    letter-spacing: .06em; cursor: pointer;
  }
  .city-auto button:hover { color: #fff; }
  .city-search { display: flex; gap: 8px; margin-bottom: 12px; }
  .city-search input {
    flex: 1; min-width: 0; height: 38px;
    padding: 0 12px;
    border: 1px solid rgba(255,255,255,.12); border-radius: 8px;
    background: rgba(255,255,255,.04);
    color: #e8ecf4; font: inherit; font-size: 12.5px;
    outline: 0;
  }
  .city-search input:focus { border-color: rgba(34,211,238,.55); box-shadow: 0 0 24px -10px rgba(34,211,238,.5); }
  .city-search input::placeholder { color: rgba(203,213,235,.3); }
  .city-search button {
    flex: none; height: 38px; padding: 0 15px;
    border: 1px solid rgba(34,211,238,.35); border-radius: 8px;
    background: rgba(34,211,238,.1);
    color: #a5f3fc; font: inherit; font-size: 11.5px; letter-spacing: .08em;
    cursor: pointer;
  }
  .city-search button:hover { background: rgba(34,211,238,.18); color: #fff; }
  .city-list {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    overflow-y: auto; padding-right: 2px;
  }
  .city-list button {
    height: 34px;
    border: 1px solid rgba(255,255,255,.08); border-radius: 6px;
    background: rgba(255,255,255,.03);
    color: rgba(232,236,244,.75);
    font: inherit; font-size: 12px;
    cursor: pointer;
    transition: border-color .2s, background .2s, color .2s;
  }
  .city-list button:hover { border-color: rgba(34,211,238,.45); background: rgba(34,211,238,.08); color: #fff; }
  .city-list button.on { border-color: rgba(34,211,238,.7); background: rgba(34,211,238,.14); color: #fff; }
  .city-tip {
    margin-top: 12px; min-height: 15px;
    font-size: 10.5px; line-height: 1.6; letter-spacing: .03em;
    color: rgba(203,213,235,.35);
  }
  @media (max-width: 640px) {
    .city-list { grid-template-columns: repeat(3, 1fr); }
    .city-box { padding: 16px; }
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #34d399;
    box-shadow: 0 0 10px 1px rgba(52,211,153,.8); animation: pulse 2.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .sep { color: rgba(255,255,255,.18); }

  /* 主体 */
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 44px 0; }
  .eyebrow {
    margin: 0 0 18px;
    font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
    color: rgba(34,211,238,.7);
  }
  .eyebrow span { color: rgba(255,255,255,.25); margin-right: 8px; }

  h1 {
    margin: 0 0 30px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: clamp(34px, 5.6vw, 56px);
    font-weight: 200;
    line-height: 1.16;
    letter-spacing: -0.01em;
    background: linear-gradient(100deg, #ffffff 18%, #a5f3fc 58%, #c4b5fd 96%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  h1 em {
    font-style: normal;
    background: linear-gradient(100deg, var(--cyan), var(--violet));
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }

  /* 搜索框 */
  .search {
    position: relative;
    display: flex; align-items: center;
    height: 66px;
    padding: 0 8px 0 20px;
    background: rgba(12,15,23,.85);
    border: 1px solid var(--line-2);
    border-radius: 12px;
    transition: border-color .3s, box-shadow .3s, background .3s;
  }
  .search::after {
    content: ""; position: absolute; inset: -1px; border-radius: 12px;
    padding: 1px; pointer-events: none;
    background: linear-gradient(100deg, rgba(34,211,238,.85), rgba(167,139,250,.7));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    opacity: 0; transition: opacity .3s;
  }
  .search:focus-within { background: rgba(15,19,29,.95); box-shadow: 0 0 60px -18px rgba(34,211,238,.55); }
  .search:focus-within::after { opacity: 1; }
  .prompt { color: rgba(34,211,238,.75); font-size: 15px; margin-right: 12px; user-select: none; }
  .search input {
    flex: 1; min-width: 0; height: 100%;
    border: 0; outline: 0; background: transparent;
    color: var(--text); font: inherit; font-size: 15px; letter-spacing: .01em;
  }
  .search input::placeholder { color: rgba(203,213,235,.32); }
  .search .enter {
    flex: none;
    display: flex; align-items: center; gap: 7px;
    height: 50px; padding: 0 16px;
    border: 0; border-left: 1px solid var(--line);
    background: transparent; color: var(--dim);
    font: inherit; font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase;
    cursor: pointer; transition: color .25s, background .25s;
  }
  .search .enter:hover { color: #fff; background: rgba(255,255,255,.04); }

  /* 引擎 */
  .engines {
    display: flex; align-items: center; gap: 22px;
    margin-top: 16px; padding-left: 2px;
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  }
  .engines .label { color: rgba(255,255,255,.22); }
  .engines button {
    position: relative;
    padding: 4px 0; border: 0; background: transparent;
    color: var(--dim); font: inherit; font-size: 11px;
    letter-spacing: .14em; text-transform: uppercase; cursor: pointer;
    transition: color .22s;
  }
  .engines button::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -3px; height: 1px;
    background: linear-gradient(90deg, var(--cyan), var(--violet));
    transform: scaleX(0); transform-origin: left;
    transition: transform .28s;
  }
  .engines button:hover { color: rgba(232,236,244,.9); }
  .engines button.active { color: #fff; }
  .engines button.active::after { transform: scaleX(1); }

  /* 链接列表 */
  .sites {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 1px;
    margin-top: 40px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  .site {
    display: flex; align-items: center; gap: 14px;
    padding: 15px 18px;
    background: rgba(8,10,16,.88);
    text-decoration: none; color: inherit;
    transition: background .25s, transform .25s;
  }
  .site:hover { background: rgba(22,28,42,.95); }
  .site .num { font-size: 10px; letter-spacing: .08em; color: rgba(34,211,238,.5); }
  .site .ico { font-size: 15px; width: 22px; text-align: center; filter: saturate(.9); }
  .site .name { flex: 1; font-size: 13px; letter-spacing: .02em; color: rgba(232,236,244,.9); }
  .site .host { display: none; font-size: 10.5px; color: rgba(203,213,235,.3); letter-spacing: .04em; }
  .site .arrow { color: rgba(203,213,235,.28); font-size: 12px; transition: color .25s, transform .25s; }
  .site:hover .arrow { color: var(--cyan); transform: translate(2px, -2px); }

  /* 底栏 */
  footer {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    font-size: 10.5px; letter-spacing: .1em; color: rgba(203,213,235,.3);
  }
  footer span b { color: rgba(203,213,235,.6); font-weight: 400; }
  .corner { display: flex; align-items: center; gap: 8px; }
  .corner::before, .corner::after { content: ""; width: 14px; height: 1px; background: rgba(255,255,255,.14); }

  .fade { animation: fade .9s cubic-bezier(.2,.8,.3,1) both; }
  @keyframes fade { from { opacity: 0; transform: translateY(10px); } }

  @media (min-width: 760px) { .site .host { display: block; } }
  @media (max-width: 640px) {
    body { padding: 0 20px; }
    .sites { grid-template-columns: 1fr; }
    .status .clock-text, .status .sep { display: none; }
    .site .host { display: none; }
    h1 { margin-bottom: 24px; }
    main { padding: 32px 0; }
  }
</style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <div class="grid" aria-hidden="true"></div>
  <div class="horizon" aria-hidden="true"></div>

  <div class="shell">
    <header class="fade">
      <div class="brand">
        <span class="mark">◈</span>
        <span>Orbit<small style="margin-left:10px">search node</small></span>
      </div>
      <div class="status">
        <span class="dot"></span>
        <span>在线</span>
        <span class="sep">/</span>
        <!-- 天气：数据来自 open-meteo，加载失败时由脚本直接移除本节点 -->
        <span class="weather" id="weather" hidden>
          <span id="w-ico">☀️</span>
          <b class="w-temp" id="w-temp">--°</b>
          <span class="w-city" id="w-city">北京</span>
        </span>
        <b class="clock-text" id="clock">--:--:--</b>
      </div>
    </header>

    <main>
      <p class="eyebrow fade" style="animation-delay:.05s"><span>01</span> 快速检索</p>
      <h1 class="fade" style="animation-delay:.1s">把问题交给<em>搜索</em>。</h1>

      <form class="search fade" id="form" style="animation-delay:.16s" autocomplete="off">
        <span class="prompt" aria-hidden="true">&gt;</span>
        <input id="q" type="text" placeholder="输入关键词，或粘贴一个网址…" spellcheck="false" aria-label="搜索" />
        <button class="enter" type="submit">Enter ↵</button>
      </form>

      <div class="engines fade" id="engines" style="animation-delay:.22s">
        <span class="label">engine</span>
      </div>

      <nav class="sites fade" id="sites" style="animation-delay:.28s" aria-label="快捷访问"></nav>
    </main>

    <footer class="fade" style="animation-delay:.36s">
      <span><b>/</b> 聚焦 &nbsp;·&nbsp; <b>Esc</b> 清空</span>
      <span class="corner">ORBIT SYSTEM</span>
    </footer>
  </div>

  <!-- 城市选择面板：点顶栏天气里的城市名打开 -->
  <div class="city-modal" id="city-modal" hidden>
    <div class="city-box" role="dialog" aria-modal="true" aria-label="选择城市">
      <div class="city-head">
        <span>选择城市</span>
        <button class="city-close" id="city-close" type="button" aria-label="关闭">×</button>
      </div>
      <div class="city-auto">
        <span id="city-now">当前：自动识别</span>
        <button type="button" id="city-auto">恢复自动</button>
      </div>
      <form class="city-search" id="city-form">
        <input id="city-input" type="text" placeholder="输入城市名，如 襄阳" aria-label="城市名" />
        <button type="submit">确定</button>
      </form>
      <div class="city-list" id="city-list"></div>
      <div class="city-tip" id="city-tip">点选城市后立即生效，选择会保存在本地</div>
    </div>
  </div>

<script>
  const ENGINES = [
    { key: 'baidu',  name: 'Baidu',      label: '百度',       url: 'https://www.baidu.com/s?wd=' },
    { key: 'google', name: 'Google',     label: '谷歌',       url: 'https://www.google.com/search?q=' },
    { key: 'bing',   name: 'Bing',       label: '必应',       url: 'https://cn.bing.com/search?q=' },
    { key: 'ddg',    name: 'DuckDuckGo', label: 'DuckDuckGo', url: 'https://duckduckgo.com/?q=' }
  ];
  const SITES = [
    { name: 'GitHub',   host: 'github.com',          icon: '🐙', url: 'https://github.com' },
    { name: 'Bilibili', host: 'bilibili.com',         icon: '📺', url: 'https://www.bilibili.com' },
    { name: '知乎',     host: 'zhihu.com',            icon: '💬', url: 'https://www.zhihu.com' },
    { name: '微博',     host: 'weibo.com',            icon: '🔥', url: 'https://weibo.com' },
    { name: 'YouTube',  host: 'youtube.com',          icon: '▶️', url: 'https://www.youtube.com' },
    { name: '淘宝',     host: 'taobao.com',           icon: '🛒', url: 'https://www.taobao.com' },
    { name: '豆瓣',     host: 'douban.com',           icon: '🎬', url: 'https://www.douban.com' },
    { name: '小红书',   host: 'xiaohongshu.com',      icon: '📕', url: 'https://www.xiaohongshu.com' }
  ];

  const $ = (s) => document.querySelector(s);
  const input = $('#q'), form = $('#form');
  let engine = localStorage.getItem('nav.engine') || 'baidu';
  if (!ENGINES.some(e => e.key === engine)) engine = 'baidu';

  function tick() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, '0');
    $('#clock').textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }
  tick(); setInterval(tick, 1000);

  function renderEngines() {
    const box = $('#engines');
    box.querySelectorAll('button').forEach(b => b.remove());
    ENGINES.forEach((e) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = e.name;
      b.title = e.label;
      if (e.key === engine) b.classList.add('active');
      b.addEventListener('click', () => {
        engine = e.key;
        localStorage.setItem('nav.engine', engine);
        renderEngines();
      });
      box.appendChild(b);
    });
  }
  renderEngines();

  $('#sites').innerHTML = SITES.map((s, i) => `
    <a class="site" href="${s.url}" target="_blank" rel="noopener">
      <span class="num">${String(i + 1).padStart(2, '0')}</span>
      <span class="ico">${s.icon}</span>
      <span class="name">${s.name}</span>
      <span class="host">${s.host}</span>
      <span class="arrow">↗</span>
    </a>`).join('');

  function isUrl(v) {
    if (/\s/.test(v)) return false;
    return /^https?:\/\//i.test(v) ||
      /^([\w-]+\.)+[a-z]{2,}(:\d+)?(\/.*)?$/i.test(v);
  }
  form.addEventListener('submit', (ev) => {
    ev.preventDefault();
    const raw = input.value.trim();
    if (!raw) return;
    if (isUrl(raw)) {
      location.href = /^https?:/i.test(raw) ? raw : 'https://' + raw;
    } else {
      const e = ENGINES.find(x => x.key === engine);
      location.href = e.url + encodeURIComponent(raw);
    }
  });

  document.addEventListener('keydown', (ev) => {
    const typing = document.activeElement === input;
    if (ev.key === '/' && !typing && !ev.metaKey && !ev.ctrlKey) {
      ev.preventDefault(); input.focus();
    }
    if (ev.key === 'Escape') {
      input.value = '';
      if (typing) input.blur();
    }
  });

  /* =========================================================================
     天气模块（独立功能，整段删除也不影响搜索）
     -------------------------------------------------------------------------
     数据源  open-meteo.com（主）→ met.no（备），都免 key
     城市    默认按 IP 自动识别，五个源依次兜底：
             ipinfo.io → ipwho.is → ipwhois.app → ip.sb → freeipapi
             全挂回退 WEATHER_CITY（北京），10 分钟内不重复请求
             不想自动识别：把 WEATHER_AUTO_CITY 改成 false
     缓存    天气 30 分钟、定位 12 小时，命中缓存不发请求
     失败    超时 / 断网 / 接口报错 → 直接删除天气节点，页面无任何提示
     关闭    把 WEATHER_ENABLED 改成 false；或删掉本段和页面里的 #weather
     ========================================================================= */
  const WEATHER_ENABLED   = true;           // ← 想彻底关掉天气：改成 false
  const WEATHER_AUTO_CITY = true;           // ← 按 IP 自动识别城市；false 则固定用 WEATHER_CITY
  const WEATHER_CITY      = '北京';         // ← 自动识别失败时的后备城市
  const WEATHER_TTL       = 30 * 60 * 1000; // 天气缓存 30 分钟
  const GEO_TTL           = 12 * 60 * 60 * 1000; // 定位结果缓存 12 小时

  /* 英文城市名 → 中文（IP 定位返回英文，映射不到就显示原文） */
  const CITY_ZH = {
    'Beijing': '北京', 'Shanghai': '上海', 'Guangzhou': '广州', 'Shenzhen': '深圳',
    'Wuhan': '武汉', 'Hangzhou': '杭州', 'Chengdu': '成都', 'Xi\'an': '西安',
    'Nanjing': '南京', 'Chongqing': '重庆', 'Tianjin': '天津', 'Suzhou': '苏州',
    'Changsha': '长沙', 'Zhengzhou': '郑州', 'Qingdao': '青岛', 'Xiamen': '厦门',
    'Fuzhou': '福州', 'Jinan': '济南', 'Hefei': '合肥', 'Kunming': '昆明',
    'Shenyang': '沈阳', 'Dalian': '大连', 'Harbin': '哈尔滨', 'Changchun': '长春',
    'Shijiazhuang': '石家庄', 'Taiyuan': '太原', 'Nanchang': '南昌', 'Guiyang': '贵阳',
    'Nanning': '南宁', 'Haikou': '海口', 'Lanzhou': '兰州', 'Urumqi': '乌鲁木齐',
    'Hohhot': '呼和浩特', 'Yinchuan': '银川', 'Xining': '西宁', 'Lhasa': '拉萨',
    'Hong Kong': '香港', 'Macau': '澳门', 'Taipei': '台北'
  };

  /* 城市 → 经纬度，按需增删 */
  const CITIES = {
    '北京': [39.9042, 116.4074], '上海': [31.2304, 121.4737],
    '广州': [23.1291, 113.2644], '深圳': [22.5431, 114.0579],
    '武汉': [30.5928, 114.3055], '襄阳': [32.0422, 112.1448],
    '宜昌': [30.6919, 111.2865], '荆州': [30.3350, 112.2397],
    '十堰': [32.6292, 110.7980], '孝感': [30.9245, 113.9165],
    '黄冈': [30.4461, 114.8724], '荆门': [31.0354, 112.1994],
    '黄石': [30.1997, 115.0389], '咸宁': [29.8413, 114.3225],
    '随州': [31.6902, 113.3826], '恩施': [30.2722, 109.4882],
    '杭州': [30.2741, 120.1551], '成都': [30.5728, 104.0668],
    '南京': [32.0603, 118.7969], '重庆': [29.5630, 106.5516],
    '天津': [39.3434, 117.3616], '苏州': [31.2989, 120.5853],
    '西安': [34.3416, 108.9398], '长沙': [28.2282, 112.9388],
    '郑州': [34.7466, 113.6253], '青岛': [36.0671, 120.3826],
    '厦门': [24.4798, 118.0894], '福州': [26.0745, 119.2965],
    '昆明': [24.8801, 102.8329], '合肥': [31.8206, 117.2272],
    '济南': [36.6512, 117.1201], '沈阳': [41.8057, 123.4315],
    '大连': [38.9140, 121.6147], '哈尔滨': [45.8038, 126.5349],
    '长春': [43.8171, 125.3235], '石家庄': [38.0428, 114.5149],
    '太原': [37.8706, 112.5489], '南昌': [28.6820, 115.8579],
    '贵阳': [26.6470, 106.6302], '南宁': [22.8170, 108.3665],
    '海口': [20.0440, 110.1983], '兰州': [36.0611, 103.8343],
    '乌鲁木齐': [43.8256, 87.6168], '呼和浩特': [40.8424, 111.7500],
    '银川': [38.4872, 106.2309], '西宁': [36.6171, 101.7782],
    '拉萨': [29.6520, 91.1721], '香港': [22.3193, 114.1694],
    '澳门': [22.1987, 113.5439], '台北': [25.0330, 121.5654]
  };

  /* WMO 天气代码 → [图标, 文字]，文字只用于鼠标悬停提示 */
  const WMO = {
    0: ['☀️', '晴'],       1: ['🌤️', '晴间多云'],  2: ['⛅', '多云'],     3: ['☁️', '阴'],
    45: ['🌫️', '雾'],      48: ['🌫️', '雾凇'],
    51: ['🌦️', '毛毛雨'],  53: ['🌦️', '毛毛雨'],   55: ['🌦️', '毛毛雨'],
    56: ['🌧️', '冻雨'],    57: ['🌧️', '冻雨'],
    61: ['🌧️', '小雨'],    63: ['🌧️', '中雨'],     65: ['🌧️', '大雨'],
    66: ['🌧️', '冻雨'],    67: ['🌧️', '冻雨'],
    71: ['🌨️', '小雪'],    73: ['🌨️', '中雪'],     75: ['❄️', '大雪'],    77: ['🌨️', '米雪'],
    80: ['🌦️', '阵雨'],    81: ['🌧️', '阵雨'],     82: ['⛈️', '强阵雨'],
    85: ['🌨️', '阵雪'],    86: ['❄️', '阵雪'],
    95: ['⛈️', '雷阵雨'],  96: ['⛈️', '雷阵雨'],   99: ['⛈️', '雷暴冰雹']
  };

  /* met.no 的天气符号 → WMO 代码（只做大致归类） */
  function metnoCode(sym) {
    const s = String(sym || '').toLowerCase();
    if (s.includes('thunder')) return 95;
    if (s.includes('heavyrain')) return 65;
    if (s.includes('lightrain')) return 61;
    if (s.includes('rain')) return 63;
    if (s.includes('heavysnow')) return 75;
    if (s.includes('lightsnow')) return 71;
    if (s.includes('snow')) return 73;
    if (s.includes('sleet')) return 66;
    if (s.includes('fog')) return 45;
    if (s.includes('partlycloudy')) return 2;
    if (s.includes('cloudy')) return 3;
    if (s.includes('fair')) return 1;
    if (s.includes('clear')) return 0;
    return 3;
  }

  /* 天气源：先用 open-meteo，失败再换 met.no（挪威气象局，全球覆盖） */
  const WEATHER_SOURCES = [
    {
      name: 'open-meteo',
      url: (lat, lon) => 'https://api.open-meteo.com/v1/forecast?latitude=' + lat +
        '&longitude=' + lon + '&current=temperature_2m,weather_code&timezone=auto',
      pick: (j) => (j.current && typeof j.current.temperature_2m === 'number')
        ? { temp: Math.round(j.current.temperature_2m), code: j.current.weather_code } : null
    },
    {
      name: 'met.no',
      url: (lat, lon) => 'https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=' + lat + '&lon=' + lon,
      pick: (j) => {
        const ts = j.properties && j.properties.timeseries;
        if (!ts || !ts.length) return null;
        const temp = ts[0].data && ts[0].data.instant && ts[0].data.instant.details
          && ts[0].data.instant.details.air_temperature;
        if (typeof temp !== 'number') return null;
        const hour = ts.find(x => x.data && x.data.next_1_hours);
        const sym = hour && hour.data.next_1_hours.summary.symbol_code;
        return { temp: Math.round(temp), code: metnoCode(sym) };
      }
    }
  ];

  /* 用不了就咔嚓掉：直接删节点，不留空白、不弹错误 */
  function dropWeather() {
    const box = document.getElementById('weather');
    if (box) box.remove();
  }

  function paintWeather(d) {
    const box = document.getElementById('weather');
    if (!box) return;
    const meta = WMO[d.code] || ['🌡️', '—'];
    document.getElementById('w-ico').textContent = meta[0];
    document.getElementById('w-temp').textContent = d.temp + '°';
    document.getElementById('w-city').textContent = d.city;
    box.title = d.city + ' · ' + meta[1] + '（点击切换城市）';
    box.hidden = false;
  }

  /* 固定城市 → 坐标；城市不在表里就回退北京 */
  function cityCoords(name) {
    const c = CITIES[name] || CITIES['北京'];
    return { city: CITIES[name] ? name : '北京', lat: c[0], lon: c[1] };
  }

  /* 英文城市名转中文，映射不到就原样返回 */
  function zhCity(name) {
    if (!name) return '';
    const hit = Object.keys(CITY_ZH).find(k => k.toLowerCase() === String(name).toLowerCase());
    return hit ? CITY_ZH[hit] : name;
  }

  /* 多个 IP 定位源，按顺序尝试，谁先成功用谁（都免 key、支持跨域） */
  const GEO_SOURCES = [
    {
      url: 'https://ipinfo.io/json',
      pick: (j) => {
        if (!j.loc) return null;
        const [lat, lon] = j.loc.split(',').map(Number);
        return { city: j.city, lat, lon };
      }
    },
    {
      url: 'https://ipwho.is/',
      pick: (j) => (j.success && j.latitude && j.longitude)
        ? { city: j.city, lat: j.latitude, lon: j.longitude } : null
    },
    {
      url: 'https://ipwhois.app/json/',
      pick: (j) => (j.success !== false && j.latitude && j.longitude)
        ? { city: j.city, lat: j.latitude, lon: j.longitude } : null
    },
    {
      url: 'https://api.ip.sb/geoip',
      pick: (j) => (j.latitude && j.longitude)
        ? { city: j.city, lat: j.latitude, lon: j.longitude } : null
    },
    {
      url: 'https://freeipapi.com/api/json',
      pick: (j) => (j.latitude && j.longitude)
        ? { city: j.cityName, lat: j.latitude, lon: j.longitude } : null
    }
  ];

  /* 定位：默认按 IP 自动识别（结果缓存 12 小时），失败静默回退后备城市 */
  async function locate() {
    /* 0. 手动选过城市：直接用它，不再走 IP 定位 */
    const manual = manualCity();
    if (manual) return manual;

    if (!WEATHER_AUTO_CITY) return cityCoords(WEATHER_CITY);

    /* 1. 12 小时内定位过：直接用，不再请求 */
    try {
      const g = JSON.parse(localStorage.getItem('nav.geo') || 'null');
      if (g && g.ts && Date.now() - g.ts < GEO_TTL && g.lat && g.lon) return g;
    } catch (e) {}

    /* 2. 刚失败过（10 分钟内）：不再重试，直接用后备城市 */
    if (Date.now() - (+localStorage.getItem('nav.geo.failTs') || 0) < 10 * 60 * 1000) {
      return cityCoords(WEATHER_CITY);
    }

    /* 3. 依次尝试多个定位源，总预算 5 秒，每个最多 2 秒 */
    const deadline = Date.now() + 5000;
    for (const s of GEO_SOURCES) {
      const left = deadline - Date.now();
      if (left <= 0) break;
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), Math.min(2000, left));
      try {
        const res = await fetch(s.url, { signal: ctrl.signal, cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const p = s.pick(await res.json());
        if (!p || !isFinite(p.lat) || !isFinite(p.lon)) throw new Error('bad geo data');
        const g = { ts: Date.now(), city: zhCity(p.city) || '当前位置', lat: p.lat, lon: p.lon };
        localStorage.setItem('nav.geo', JSON.stringify(g));
        localStorage.removeItem('nav.geo.failTs');
        return g;
      } catch (e) {
        /* 这个源不行，换下一个 */
      } finally {
        clearTimeout(timer);
      }
    }

    /* 4. 全部失败：记一笔，10 分钟内不再试，用后备城市 */
    localStorage.setItem('nav.geo.failTs', Date.now());
    return cityCoords(WEATHER_CITY);
  }

  function readWeatherCache(city) {
    try {
      const d = JSON.parse(localStorage.getItem('nav.weather') || 'null');
      if (!d || d.city !== city || !d.ts) return null;
      return Date.now() - d.ts > WEATHER_TTL ? null : d;
    } catch (e) { return null; }
  }

  async function loadWeather() {
    if (!WEATHER_ENABLED) { dropWeather(); return; }

    /* 1. 确定位置：自动识别（缓存 12 小时）或固定城市 */
    const place = await locate();

    /* 2. 命中天气缓存：直接画，不发请求 */
    const cached = readWeatherCache(place.city);
    if (cached) { paintWeather(cached); return; }

    /* 3. 依次尝试天气源，总预算 8 秒，每个最多 4 秒 */
    const deadline = Date.now() + 8000;
    for (const s of WEATHER_SOURCES) {
      const left = deadline - Date.now();
      if (left <= 0) break;
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), Math.min(4000, left));
      try {
        const res = await fetch(s.url(place.lat, place.lon), { signal: ctrl.signal, cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const p = s.pick(await res.json());
        if (!p || !isFinite(p.temp) || p.code === undefined) throw new Error('bad weather data');
        const data = { ts: Date.now(), city: place.city, temp: p.temp, code: p.code };
        localStorage.setItem('nav.weather', JSON.stringify(data));
        paintWeather(data);
        return;
      } catch (e) {
        /* 这个源不行，换下一个 */
      } finally {
        clearTimeout(timer);
      }
    }

    /* 4. 所有源都失败：咔嚓掉，不影响页面其他功能 */
    dropWeather();
  }

  loadWeather();

  /* =========================================================================
     城市选择（手动覆盖 IP 定位）
     -------------------------------------------------------------------------
     点天气里的城市名打开面板，选一次就记住，下次打开直接用
     「恢复自动」会删掉手动选择，重新按 IP 识别
     ========================================================================= */
  const cityModal = document.getElementById('city-modal');
  const cityList = document.getElementById('city-list');
  const cityInput = document.getElementById('city-input');
  const cityTip = document.getElementById('city-tip');

  function manualCity() {
    try {
      const c = JSON.parse(localStorage.getItem('nav.city') || 'null');
      return (c && c.city && typeof c.lat === 'number' && typeof c.lon === 'number') ? c : null;
    } catch (e) { return null; }
  }

  function openCity() {
    const cur = manualCity();
    document.getElementById('city-now').textContent = cur ? '当前：' + cur.city : '当前：自动识别';
    cityList.innerHTML = Object.keys(CITIES).map((name) =>
      '<button type="button" data-city="' + name + '"' +
      (cur && cur.city === name ? ' class="on"' : '') + '>' + name + '</button>'
    ).join('');
    cityInput.value = '';
    cityTip.textContent = '点选城市后立即生效，选择会保存在本地';
    cityModal.hidden = false;
    setTimeout(function () { cityInput.focus(); }, 40);
  }

  function closeCity() { cityModal.hidden = true; }

  function applyCity(city, lat, lon) {
    localStorage.setItem('nav.city', JSON.stringify({ city: city, lat: lat, lon: lon }));
    localStorage.removeItem('nav.weather');
    localStorage.removeItem('nav.geo.failTs');
    closeCity();
    if (!document.getElementById('weather')) { location.reload(); return; }
    loadWeather();
  }

  cityList.addEventListener('click', function (ev) {
    const btn = ev.target.closest('button[data-city]');
    if (!btn) return;
    const name = btn.getAttribute('data-city');
    const pos = CITIES[name];
    if (pos) applyCity(name, pos[0], pos[1]);
  });

  document.getElementById('city-close').addEventListener('click', closeCity);
  cityModal.addEventListener('click', function (ev) {
    if (ev.target === cityModal) closeCity();
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && !cityModal.hidden) closeCity();
  });

  document.getElementById('city-auto').addEventListener('click', function () {
    localStorage.removeItem('nav.city');
    localStorage.removeItem('nav.weather');
    localStorage.removeItem('nav.geo.failTs');
    closeCity();
    loadWeather();
  });

  /* 输入城市名：用 open-meteo 地理编码查坐标，能选表里没有的城市 */
  document.getElementById('city-form').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    const name = cityInput.value.trim();
    if (!name) return;

    /* 1. 本地城市表优先：坐标已核对，也不发请求 */
    if (CITIES[name]) {
      applyCity(name, CITIES[name][0], CITIES[name][1]);
      return;
    }

    /* 2. 表里没有：查地理编码，限定国内，并优先同名、人口多的结果 */
    cityTip.textContent = '正在查询…';
    try {
      const res = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=10&language=zh&format=json&countryCode=CN&name=' + encodeURIComponent(name));
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const j = await res.json();
      const list = (j.results || []).filter((x) => x.country_code === 'CN');
      if (!list.length) throw new Error('not found');
      const same = list.filter((x) => x.name === name);
      const hit = (same.length ? same : list).sort((a, b) => (b.population || 0) - (a.population || 0))[0];
      applyCity(hit.name || name, hit.latitude, hit.longitude);
    } catch (e) {
      cityTip.textContent = '没查到「' + name + '」，换个写法或直接从下面选';
    }
  });

  /* 点天气胶囊打开面板 */
  document.addEventListener('click', function (ev) {
    if (ev.target.closest('#weather')) openCity();
  });
</script>
